# Passkey retrieval at extreme budgets (2%, 5%). At 10-20% every token-scoring method
# finds the key 100% of the time (ceiling), so these budgets are needed to separate methods.
name: passkey_extreme_qwen3b
model: Qwen/Qwen2.5-3B-Instruct
dtype: auto
window: 32
methods: [snapkv, pyramidkv, random_alloc, entropy, cake_style]
budgets: [0.02, 0.05]
passkey:
  lengths: [4096, 8192, 16384]
  depths: [0.0, 0.25, 0.5, 0.75, 1.0]
  trials: 10
output: results/passkey_extreme_qwen3b.jsonl
