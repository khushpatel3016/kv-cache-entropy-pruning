# Does the result transfer to a second model family? 20% budget only.
# Needs Hugging Face access to meta-llama (request on the model page, then `huggingface-cli login`).
name: llama3b_generalisation
model: meta-llama/Llama-3.2-3B-Instruct
dtype: auto
window: 32
max_len: 8192
static_profile: profiles/llama3.2-3b-instruct.json
methods: [full, snapkv, pyramidkv, entropy_static, entropy, cake_style]
budgets: [0.2]
longbench:
  tasks: [qasper, hotpotqa, gov_report, trec, passage_retrieval_en, lcc]
  limit: 50
output: results/llama3b_generalisation.jsonl
