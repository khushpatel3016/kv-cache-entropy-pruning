# Same test as passkey_confirm_qwen3b on Llama-3.2-3B: at 2-3% of a 4K prompt, does giving
# low-entropy layers more tokens (tau = -1, CAKE-style) beat giving high-entropy layers more?
name: passkey_confirm_llama3b
model: meta-llama/Llama-3.2-3B-Instruct
dtype: auto
window: 32
methods: [snapkv, entropy, "entropy:tau=-1", cake_style]
budgets: [0.02, 0.03]
passkey:
  lengths: [4096]
  depths: [0.0, 0.25, 0.5, 0.75, 1.0]
  trials: 30
output: results/passkey_confirm_llama3b.jsonl
